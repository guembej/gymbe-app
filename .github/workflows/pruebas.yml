name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      # Comprobación de tipos: no compila nada, solo revisa los archivos
      # marcados con "// @ts-check". Es rápida, así que va antes.
      - name: Comprobar tipos
        run: npm run tipos

      - run: npx playwright install --with-deps chromium

      # Pruebas de lógica + smoke test (la app arranca sin errores de consola)
      - run: npm test
